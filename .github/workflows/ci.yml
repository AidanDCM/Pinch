name: CI

on:
  push:
    branches: [main, "dev/**"]
  pull_request:

jobs:
  pricing-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run typecheck
